# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Publish host
      run: dotnet publish ForensicsAgentHost -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o out
    - name: Publish worker
      run: dotnet publish ForensicsAgentWorker -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o out
    - name: Release
      run: gh release create build-${{ github.run_number }} out/ForensicsAgentHost.exe out/ForensicsAgentWorker.exe --target ${{ github.sha }} --generate-notes
      env:
        GH_TOKEN: ${{ github.token }}
